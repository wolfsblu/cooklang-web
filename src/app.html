<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
		/>
		<meta name="color-scheme" content="light dark" />
		<script>
			// Follow the device before first paint, and keep following it: with
			// no toggle there is no stored preference to win over the OS.
			(() => {
				const query = matchMedia('(prefers-color-scheme: dark)');
				const apply = () => {
					document.documentElement.dataset.theme = query.matches ? 'dark' : 'light';
				};

				// Drop the key left behind by the old theme toggle so a stale
				// choice cannot shadow the device setting later.
				localStorage.removeItem('theme');

				apply();
				query.addEventListener('change', apply);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
