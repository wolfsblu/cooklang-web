<!doctype html>
<html lang="en" data-theme="light" data-nav-rail="auto">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
		/>
		<meta name="color-scheme" content="light dark" />
		<script>
			// Paint the right palette before hydration. `system` follows the OS;
			// the listener below keeps following it while that preference is
			// selected. Keep the key and values in step with `$lib/theme`.
			(() => {
				const key = 'theme';
				const query = matchMedia('(prefers-color-scheme: dark)');

				const stored = () => {
					try {
						const value = localStorage.getItem(key);
						return value === 'light' || value === 'dark' || value === 'system' ? value : 'system';
					} catch {
						return 'system';
					}
				};

				const apply = () => {
					const preference = stored();
					document.documentElement.dataset.theme =
						preference === 'system' ? (query.matches ? 'dark' : 'light') : preference;
				};

				apply();
				query.addEventListener('change', () => {
					if (stored() === 'system') apply();
				});
			})();
		</script>
		<script>
			// Apply the desktop rail preference before first paint too, so a
			// collapsed rail never flashes open while the app hydrates. `auto`
			// lives in CSS and follows the breakpoint.
			(() => {
				try {
					const value = localStorage.getItem('cooklang-nav-rail');
					document.documentElement.dataset.navRail =
						value === 'expanded' || value === 'collapsed' ? value : 'auto';
				} catch {
					document.documentElement.dataset.navRail = 'auto';
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
